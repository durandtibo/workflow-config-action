# Formatting and linting workflow.
# Checks the Markdown and YAML files of the repository.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Lint Markdown files
        run: |
          make lint-markdown

      - name: Lint YAML files
        run: |
          make lint-yaml
