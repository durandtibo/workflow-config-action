# Main Continuous Integration Pipeline
#
# This workflow runs on every push and pull request to the main branch.
# It orchestrates the complete CI pipeline by calling reusable workflows.
#
# Jobs:
#   - test-local: Tests the action using current repository code
#   - test-stable: Tests the published stable action version
#
# Permissions:
#   - contents: read - Required to checkout repository code

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  test-local:
    uses: ./.github/workflows/ci-test-local.yaml
  test-stable:
    uses: ./.github/workflows/ci-test-stable.yaml
