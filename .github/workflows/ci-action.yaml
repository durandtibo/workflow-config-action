# Workflow testing the action in a real workflow. One file tests both versions:
#   - use-released: false (default, called by ci.yaml): the action from the current checkout
#     (uses: ./), i.e. the version that is not released yet.
#   - use-released: true (called by nightly.yaml): the latest released action, to catch
#     regressions in what consumers pick up. Update the pinned release below when a new
#     version is released (bot-pin-action.yaml does it).
# Every job has one step per version, selected by `if`, and one shared verify step that calls
# dev/check_action_case.sh, so the two runs cannot drift apart. A step that was skipped has no
# outputs: the verify steps read `steps.local.outputs.x || steps.released.outputs.x`.
#
# The action has no code outside action.yaml (bash and jq in the `load` step), so there is no
# unit test level: these tests are the only tests of the logic, and they assert on the exact
# value or on the format of every output, never just print them.
#
# Two levels of tests:
#   - general behaviour (`test`): the default config on every OS of the matrix (Linux and
#     macOS; Windows is not claimed by the README). The default config of the released action
#     can differ from the working tree, so the outputs are checked against the `config` output
#     of the action itself, and, for the local action only, against configs/versions.json.
#   - edge cases (`test-cases`): one row of tests/cases.json per matrix cell, on the *-latest
#     runners (the sort, jq and bash of Linux and macOS differ). A new case is a new row, not
#     a new job. A row has "released": false until the last release has the feature (the
#     released run skips those rows). A row that expects a failure follows a positive run on
#     the same runner, so that it cannot fail for the wrong reason. The error annotation of
#     such a row is expected.
#   - released files (`test-downloaded-files`, released action only): the runner downloaded
#     only the runtime files. The local equivalent is ci-export.yaml (make check-export).
#
# Run by hand (workflow_dispatch) to test one version without ci.yaml or nightly.yaml.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Only for a manual run: a caller passes the matrix as an input
  get-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # The cases of the edge case tests, as a matrix
  get-cases:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Read the cases
        id: cases
        shell: bash
        run: echo "cases=$(jq -c . tests/cases.json)" >> "$GITHUB_OUTPUT"

  # General behaviour: the default config on every OS of the matrix
  test:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup workflow config (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./

      - name: Setup workflow config (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/workflow-config-action@9dbe1b206e5367c4c7f9aeb658b7e91d5749a3fa # ratchet:durandtibo/workflow-config-action@v0.3.1

      - name: Check the outputs
        shell: bash
        env:
          CASE: '{"id":"default-config","inputs":{},"expect":"success","non-empty":true}'
          OUTCOME: success
          # The released action bundles its own config, which can differ from the working tree
          BUNDLED_CONFIG: ${{ inputs.use-released && '' || 'configs/versions.json' }}
          CONFIG: ${{ steps.local.outputs.config || steps.released.outputs.config }}
          PYTHON_VERSIONS_STANDARD: ${{ steps.local.outputs.python_versions_standard || steps.released.outputs.python_versions_standard }}
          PYTHON_VERSIONS_THREADED: ${{ steps.local.outputs.python_versions_threaded || steps.released.outputs.python_versions_threaded }}
          PYTHON_VERSIONS: ${{ steps.local.outputs.python_versions || steps.released.outputs.python_versions }}
          OS_UBUNTU: ${{ steps.local.outputs.os_ubuntu || steps.released.outputs.os_ubuntu }}
          OS_MACOS: ${{ steps.local.outputs.os_macos || steps.released.outputs.os_macos }}
          OS_WINDOWS: ${{ steps.local.outputs.os_windows || steps.released.outputs.os_windows }}
          OS_UNIX: ${{ steps.local.outputs.os_unix || steps.released.outputs.os_unix }}
          OS_ALL: ${{ steps.local.outputs.os_all || steps.released.outputs.os_all }}
          VALUE: ${{ steps.local.outputs.value || steps.released.outputs.value }}
        run: ./dev/check_action_case.sh

  # Edge cases on the *-latest runners: one row of tests/cases.json per cell
  test-cases:
    needs: [get-matrix, get-cases]
    if: ${{ !cancelled() && needs.get-cases.result == 'success' && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}
        case: ${{ fromJson(needs.get-cases.outputs.cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # A row that expects a failure follows a positive run on the same runner
      - name: Positive run before a failure case (local)
        if: ${{ !inputs.use-released && matrix.case.expect == 'failure' }}
        uses: ./
      - name: Positive run before a failure case (released)
        if: ${{ inputs.use-released && matrix.case.released && matrix.case.expect == 'failure' }}
        uses: durandtibo/workflow-config-action@9dbe1b206e5367c4c7f9aeb658b7e91d5749a3fa # ratchet:durandtibo/workflow-config-action@v0.3.1

      # The case. A failure is expected for some rows: its error annotation is expected
      - name: Run the case (local)
        id: local
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./
        with:
          config: ${{ matrix.case.inputs.config || '' }}
          key: ${{ matrix.case.inputs.key || '' }}
      - name: Run the case (released)
        id: released
        if: ${{ inputs.use-released && matrix.case.released }}
        continue-on-error: true
        uses: durandtibo/workflow-config-action@9dbe1b206e5367c4c7f9aeb658b7e91d5749a3fa # ratchet:durandtibo/workflow-config-action@v0.3.1
        with:
          config: ${{ matrix.case.inputs.config || '' }}
          key: ${{ matrix.case.inputs.key || '' }}

      - name: Check the case
        if: ${{ !inputs.use-released || matrix.case.released }}
        shell: bash
        env:
          CASE: ${{ toJson(matrix.case) }}
          OUTCOME: ${{ steps.local.outcome == 'skipped' && steps.released.outcome || steps.local.outcome }}
          CONFIG: ${{ steps.local.outputs.config || steps.released.outputs.config }}
          PYTHON_VERSIONS_STANDARD: ${{ steps.local.outputs.python_versions_standard || steps.released.outputs.python_versions_standard }}
          PYTHON_VERSIONS_THREADED: ${{ steps.local.outputs.python_versions_threaded || steps.released.outputs.python_versions_threaded }}
          PYTHON_VERSIONS: ${{ steps.local.outputs.python_versions || steps.released.outputs.python_versions }}
          OS_UBUNTU: ${{ steps.local.outputs.os_ubuntu || steps.released.outputs.os_ubuntu }}
          OS_MACOS: ${{ steps.local.outputs.os_macos || steps.released.outputs.os_macos }}
          OS_WINDOWS: ${{ steps.local.outputs.os_windows || steps.released.outputs.os_windows }}
          OS_UNIX: ${{ steps.local.outputs.os_unix || steps.released.outputs.os_unix }}
          OS_ALL: ${{ steps.local.outputs.os_all || steps.released.outputs.os_all }}
          VALUE: ${{ steps.local.outputs.value || steps.released.outputs.value }}
        run: ./dev/check_action_case.sh

  # Released action only: the runner downloads the exported files, so a file that
  # .gitattributes ignores by mistake is missing here. (The local action runs from the whole
  # checkout and hides it: ci-export.yaml checks the exported set of the current code.)
  test-downloaded-files:
    needs: get-matrix
    if: ${{ !cancelled() && inputs.use-released && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup workflow config (released)
        uses: durandtibo/workflow-config-action@9dbe1b206e5367c4c7f9aeb658b7e91d5749a3fa # ratchet:durandtibo/workflow-config-action@v0.3.1

      - name: Assert that only the runtime files of the released action were downloaded
        shell: bash
        run: |
          set -euo pipefail
          # The runner downloads actions next to the workspace, in _work/_actions/<owner>/<repo>/<sha>.
          ACTIONS_DIR="$RUNNER_WORKSPACE/../_actions/durandtibo/workflow-config-action"
          dirs=("$ACTIONS_DIR"/*/)
          if [ "${#dirs[@]}" -ne 1 ] || [ ! -d "${dirs[0]}" ]; then
            echo "::error::Expected exactly one downloaded version in $ACTIONS_DIR, got: ${dirs[*]}"
            exit 1
          fi
          actual="$(cd "${dirs[0]}" && find . -type f | sed 's|^\./||' | LC_ALL=C sort)"
          # The action file of the releases up to v0.3.1 is action.yml, then action.yaml
          expected="$(printf '%s\n' LICENSE configs/versions.json "$(if [ -f "${dirs[0]}action.yaml" ]; then echo action.yaml; else echo action.yml; fi)" | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected files in the released action. Expected:"$'\n'"$expected"$'\n'"Actual:"$'\n'"$actual"
            exit 1
          fi
          echo "✅ Only the runtime files were downloaded"
